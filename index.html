<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ban Personal Repo</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #e5e7eb; }
    main { width: min(680px, calc(100% - 40px)); padding: 36px; box-sizing: border-box; border: 1px solid #26324d; border-radius: 24px; background: #111827; box-shadow: 0 24px 80px #0006; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 20px 0 8px; font-size: 30px; }
    p { color: #aab5ca; line-height: 1.7; }
    code { display: block; overflow-wrap: anywhere; margin: 20px 0; padding: 14px 16px; border-radius: 12px; background: #0b1020; color: #93c5fd; }
    small { color: #8290a8; }
  </style>
</head>
<body>
  <main>
    <img src="icon.svg" alt="Repo icon">
    <h1>Ban Personal Repo</h1>
    <p>自用 iOS 越狱软件源。将本页面所在网址添加到 Sileo、Zebra 或 Cydia 即可。</p>
    <code>https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPOSITORY/</code>
    <small>部署后，把上面的示例地址替换成实际仓库地址；每次新增或更新 .deb 后重新运行 build 脚本。</small>
  </main>
</body>
</html>
